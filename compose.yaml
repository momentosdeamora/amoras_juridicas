name: farol-juridico
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    image: farol-app:local
    init: true
    user: "1000:1000"
    ports:
      - "127.0.0.1:${FAROL_PORT:-5000}:5000"
    environment:
      FAROL_CONTAINER: "1"
      FAROL_DATA_DIR: /app/data
      FAROL_OLLAMA_URL: http://ollama:11434
      FAROL_PUBLIC_PORT: "${FAROL_PORT:-5000}"
      FAROL_REQUIRE_AUTH: "1"
      FAROL_ACCESS_TOKEN_FILE: /run/secrets/farol_access_token
    secrets:
      - farol_access_token
    volumes:
      - ./data:/app/data
    networks: [private]
    depends_on:
      ollama:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 20s
    restart: unless-stopped

  ollama:
    build:
      context: .
      dockerfile: docker/Dockerfile.ollama
    image: farol-ollama:local
    init: true
    user: "10001:10001"
    volumes:
      - ollama_models:/models
      - ollama_state:/home/farolmodel
    networks: [private]
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 8g
    cpus: 6
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    healthcheck:
      test: ["CMD", "/bin/ollama", "show", "qwen3:1.7b"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  # Executado explicitamente, antes da aplicação. Somente este perfil acessa a rede para download.
  model-download:
    profiles: [setup]
    build:
      context: .
      dockerfile: docker/Dockerfile.ollama
    image: farol-ollama:local
    user: "10001:10001"
    entrypoint: ["/usr/local/bin/pull-farol-model"]
    volumes:
      - ollama_models:/models
      - ollama_state:/home/farolmodel
    networks: [bootstrap]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 8g

  # Alternativa offline: reaproveita o modelo já baixado no workspace.
  model-import:
    profiles: [setup]
    build:
      context: .
      dockerfile: docker/Dockerfile.ollama
    image: farol-ollama:local
    user: "10001:10001"
    entrypoint: ["/bin/sh", "-c"]
    command: ["cp -R /import/. /models/"]
    volumes:
      - ./.runtime/models:/import:ro
      - ollama_models:/models
    network_mode: none
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  private:
    internal: true
  bootstrap: {}
volumes:
  ollama_models: {}
  ollama_state: {}
secrets:
  farol_access_token:
    file: ./.secrets/access_token
